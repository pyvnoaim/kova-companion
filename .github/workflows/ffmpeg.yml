name: ffmpeg

# Builds the autoclipper's cut-only ffmpeg.exe (scripts/build-ffmpeg.sh) and
# publishes it as a PRE-release: the app's auto-updater follows the latest
# regular release, so this never shadows an app version. Run it by hand when the
# ffmpeg version or flags change, then pin the printed sha256 in
# scripts/ffmpeg-pin.json - the release script refuses to ship anything else.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish to (match scripts/ffmpeg-pin.json)
        default: ffmpeg-7.1.1-1
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: scripts/build-ffmpeg.sh win64
      - name: sha256 to pin
        run: |
          sha256sum vendor/ffmpeg/ffmpeg.exe | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Put this sha256 into scripts/ffmpeg-pin.json.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false \
            --title "$TAG (autoclipper ffmpeg, not an app release)" \
            --notes "Cut-only LGPL ffmpeg bundled with kova companion. See SOURCE.md."
          gh release upload "$TAG" vendor/ffmpeg/ffmpeg.exe vendor/ffmpeg/LICENSE.md vendor/ffmpeg/SOURCE.md --clobber
